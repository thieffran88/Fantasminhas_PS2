name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag do release a publicar (ex.: v1.0.0). Vazio = só compila."
        required: false
        default: ""

jobs:
  testes:
    name: Testes de regras (PC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -f Makefile.host all test

  ps2:
    name: PlayStation 2 (ELF + ISO)
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    permissions:
      contents: write
    steps:
      - name: Dependências
        run: apk add --no-cache build-base git xorriso
      - uses: actions/checkout@v4
      - name: Compilar ELF
        run: make
      - name: Gerar ISO
        run: make iso
      - uses: actions/upload-artifact@v4
        with:
          name: prefeitos-do-alem-ps2
          path: |
            prefeitos_do_alem.elf
            prefeitos_do_alem.iso
      # publica o ELF e a ISO em Releases ao enviar uma tag v* (ex.: v1.0.0)
      # ou ao rodar o workflow manualmente informando release_tag
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Prefeitos do Além PS2 ${{ inputs.release_tag || github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            prefeitos_do_alem.elf
            prefeitos_do_alem.iso
